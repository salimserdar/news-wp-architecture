; PHP-FPM pool for native (no Docker, no page cache) installs.
; Copied by scripts/setup-vps-native.sh → /etc/php/8.3/fpm/pool.d/www.conf
;
; Sized for uncached WordPress: every request hits PHP, so start smaller
; than the Docker public pool (48 static). Override pm.max_children via
; PHP_MAX_CHILDREN when running the setup script.
; Measure RSS:  ps -ylC php-fpm8.3 --sort:rss

[www]
user  = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 4096

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.status_path = /-/fpm-status

request_terminate_timeout = 60s
request_slowlog_timeout   = 5s
slowlog = /var/log/php8.3-fpm-slow.log

; 512M: Newspaper / tagDiv admin and Gutenberg CSS registration exceed 256M.
; WP_MAX_MEMORY_LIMIT in wp-config cannot raise php_admin_value.
php_admin_value[memory_limit] = 512M
php_admin_flag[log_errors] = on
; PHP JIT tracing segfaults / hangs wp-admin/load-styles.php on this theme.
php_admin_value[opcache.jit] = disable
php_admin_value[opcache.jit_buffer_size] = 0
