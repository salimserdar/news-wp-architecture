; PHP-FPM pool for EDITORS (container "php-admin").
; Logged-in users, wp-admin, wp-login, REST writes, media uploads, imports.
; Slow here never affects readers, who are served by the "php" container.
[www]
user  = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
pm.status_path = /-/fpm-status
ping.path = /-/fpm-ping

request_terminate_timeout = 300s    ; imports, bulk actions, image regeneration
request_slowlog_timeout   = 10s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 300
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
