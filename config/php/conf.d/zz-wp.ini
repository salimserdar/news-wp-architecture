; PHP-FPM settings. Installed by scripts/setup-vps.sh as /etc/php/8.3/fpm/conf.d/99-wp.ini
; (JIT keys are stripped there — see pool-www.conf).

; --- OPcache: compiled code stays in memory ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
; Re-check file mtimes at most once a minute so plugin/theme updates from
; wp-admin show up without an FPM reload. Production deploys should still
; `systemctl reload php8.3-fpm` to clear OPcache immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; --- Uploads (editors upload large images / audio) ---
upload_max_filesize = 128M
post_max_size = 128M
max_input_vars = 5000
max_execution_time = 60

; --- Realpath cache: WordPress includes hundreds of files per request ---
realpath_cache_size = 4M
realpath_cache_ttl = 600

; --- Sessions / misc ---
expose_php = Off
date.timezone = UTC
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
