; PHP settings for both FPM pools (mounted into /usr/local/etc/php/conf.d/).

; --- OPcache: compiled code stays in memory; no file stat()s in production ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
; Re-check file mtimes at most once a minute. Plugin/theme updates done from
; wp-admin land in the "php-admin" container but must also be picked up by the
; "php" container, which never runs the updater — so we can't use 0 here.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; --- Uploads (editors upload large images / audio) ---
upload_max_filesize = 128M
post_max_size = 128M
max_input_vars = 5000
max_execution_time = 60

; --- Realpath cache: WordPress includes hundreds of files per request ---
realpath_cache_size = 4M
realpath_cache_ttl = 600

; --- Sessions / misc ---
expose_php = Off
date.timezone = UTC
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Redis client defaults (used by the object-cache drop-in) ---
redis.session.locking_enabled = 0
