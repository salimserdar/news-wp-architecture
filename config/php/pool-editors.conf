; PHP-FPM editors pool. Copied by scripts/setup-vps.sh → /etc/php/8.3/fpm/pool.d/editors.conf
;
; Logged-in users, /wp-admin/, /wp-login.php, admin-ajax, async-upload and
; authenticated REST calls land here (map $php_upstream in config/nginx/http.conf).
; Nothing a crawler can reach uses this socket, so the newsroom keeps
; publishing while the public pool is saturated.
;
; Override size with PHP_EDITOR_CHILDREN when running the setup script.
; 16 children is enough for a few dozen simultaneous editors: each admin
; request holds a child for 100–500 ms, uploads for a few seconds.

[editors]
user  = www-data
group = www-data
listen = /run/php/php8.3-fpm-editors.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; Editors wait rather than get a 502 while a big upload finishes.
listen.backlog = 512

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
; Distinct path: nginx passes SCRIPT_NAME = request URI (site.conf).
pm.status_path = /-/fpm-status-editors

; Media imports and bulk actions legitimately run for minutes.
request_terminate_timeout = 300s
request_slowlog_timeout   = 10s
slowlog = /var/log/php8.3-fpm-editors-slow.log

php_admin_value[memory_limit] = 512M
php_admin_flag[log_errors] = on
; WordPress tracks uploads in the browser, not via PHP_SESSION_UPLOAD_PROGRESS.
; Keep this off until the next PHP bugfix (CVE-2026-115560; same knob as CVE-2026-109619).
; PHP_INI_PERDIR: an admin flag cannot be turned back on from .user.ini or ini_set().
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[opcache.jit] = disable
php_admin_value[opcache.jit_buffer_size] = 0
