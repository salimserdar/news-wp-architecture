; PHP-FPM pool for PUBLIC traffic (container "php").
; Only cache misses and non-cacheable anonymous requests reach this pool.
; Overrides the [www] pool shipped in the image (loaded last: zz-pool.conf).
[www]
user  = www-data
group = www-data
listen = 9000

; Static: predictable memory, no fork latency during a spike.
; 48 children x ~80 MB = ~4 GB (container limit 5 GB). Measure real RSS with:
;   docker compose exec php sh -c 'ps -o rss,comm | grep php-fpm'
pm = static
pm.max_children = 48
pm.max_requests = 1000              ; recycle workers to contain leaks
pm.status_path = /-/fpm-status      ; only reachable via nginx internal locations
ping.path = /-/fpm-ping

request_terminate_timeout = 60s
request_slowlog_timeout   = 5s
slowlog = /proc/self/fd/2           ; -> docker logs

catch_workers_output = yes
decorate_workers_output = no
clear_env = no                      ; WordPress image reads DB config from env

php_admin_value[memory_limit] = 256M
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
