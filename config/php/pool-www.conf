; PHP-FPM public pool. Copied by scripts/setup-vps.sh → /etc/php/8.3/fpm/pool.d/www.conf
;
; Serves anonymous cache misses only. Logged-in traffic (wordpress_logged_in_
; cookie), /wp-admin/ and /wp-login.php go to pool-editors.conf through the
; $php_upstream map in config/nginx/http.conf, so a crawler walking unique
; URLs can fill this pool without touching the newsroom.
;
; Sizing (8 vCPU / 32 GB): a child is ~80–120 MB RSS, so 48 children ≈ 5 GB.
; Override with PHP_MAX_CHILDREN when running the setup script.
; Measure RSS:  ps -ylC php-fpm8.3 --sort:rss
;
; listen.backlog is small on purpose. When every child is busy, nginx's
; connect() fails immediately instead of parking the request in a 4096-deep
; FIFO for minutes. fastcgi_cache_use_stale (error) then serves the previous
; copy, and the queue never gets long enough to starve anyone.

[www]
user  = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 256

pm = dynamic
pm.max_children = 48
pm.start_servers = 16
pm.min_spare_servers = 8
pm.max_spare_servers = 24
pm.max_requests = 500
pm.status_path = /-/fpm-status

; A public render that takes a minute is a bug, not a request worth keeping.
request_terminate_timeout = 60s
request_slowlog_timeout   = 5s
slowlog = /var/log/php8.3-fpm-slow.log

; 512M: Gutenberg CSS registration and some blocks exceed 256M.
; WP_MAX_MEMORY_LIMIT in wp-config cannot raise php_admin_value.
php_admin_value[memory_limit] = 512M
php_admin_flag[log_errors] = on
; WordPress tracks uploads in the browser, not via PHP_SESSION_UPLOAD_PROGRESS.
; Keep this off until the next PHP bugfix (CVE-2026-115560; same knob as CVE-2026-109619).
; PHP_INI_PERDIR: an admin flag cannot be turned back on from .user.ini or ini_set().
php_admin_flag[session.upload_progress.enabled] = off
; PHP JIT tracing segfaults / hangs wp-admin/load-styles.php on this theme.
php_admin_value[opcache.jit] = disable
php_admin_value[opcache.jit_buffer_size] = 0
