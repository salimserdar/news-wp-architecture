# Native (no Docker, no FastCGI cache) main nginx config.
# Installed by scripts/setup-vps-native.sh → /etc/nginx/nginx.conf
#
# Site/server blocks: native/site.conf. Reusable pieces live in snippets/
# (same files as the Docker stack, minus fastcgi-cache.conf).

user  www-data;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid   /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format news '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'up=$upstream_addr ray=$http_cf_ray';
    access_log /var/log/nginx/access.log news buffer=64k flush=5s;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 4096;
    server_tokens       off;
    client_max_body_size     128m;
    client_body_buffer_size  512k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml
               application/xml application/xhtml+xml font/woff2 text/javascript;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    limit_req_zone  $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
