# Native WordPress origin — no FastCGI cache, one PHP-FPM pool via unix socket.
# Installed by scripts/setup-vps-native.sh → /etc/nginx/conf.d/site.conf

upstream php_fpm {
    server unix:/run/php/php8.3-fpm.sock;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /-/health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    root  /var/www/html;
    index index.php;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/wordpress-hardening.conf;

    location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|mp4|webm|mp3|pdf)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/fastcgi-php.conf;
        include /etc/nginx/snippets/security-headers.conf;
        fastcgi_pass php_fpm;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/snippets/fastcgi-php.conf;
        include /etc/nginx/snippets/security-headers.conf;
        fastcgi_pass php_fpm;
    }

    location = /-/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
