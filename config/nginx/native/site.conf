# Native WordPress origin — no FastCGI cache, one PHP-FPM pool via unix socket.
# Installed by scripts/setup-vps-native.sh → /etc/nginx/sites-available/wordpress
#
# HTTP and HTTPS both serve WordPress so a first visit to http://IP/ works
# (self-signed cert on 443). Enable HTTPS-only redirect after Cloudflare is in front.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # "ssl http2" on listen: Ubuntu 24.04 ships nginx 1.24, which rejects `http2 on;`.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    root  /var/www/html;
    index index.php;
    autoindex off;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/wordpress-hardening.conf;

    location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|mp4|webm|mp3|pdf)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
    }

    # $uri/ is required so /wp-admin/ uses wp-admin/index.php. A 403 on /
    # means index.php is missing or the Ubuntu default site is still first.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/fastcgi-php.conf;
        include /etc/nginx/snippets/security-headers.conf;
        fastcgi_pass php_fpm;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/snippets/fastcgi-php.conf;
        include /etc/nginx/snippets/security-headers.conf;
        fastcgi_pass php_fpm;
    }

    location = /-/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
