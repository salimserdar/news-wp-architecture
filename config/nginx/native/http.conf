# Native http{} extras. Installed by scripts/setup-vps-native.sh as
# /etc/nginx/conf.d/00-news-wp.conf (Ubuntu's nginx.conf already includes conf.d/).
# Do not put server{} blocks here — those live in native/site.conf.

client_max_body_size     128m;
client_body_buffer_size  512k;
server_tokens            off;
keepalive_requests       1000;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/rss+xml application/atom+xml image/svg+xml
           application/xml application/xhtml+xml font/woff2 text/javascript;

include /etc/nginx/snippets/cloudflare-realip.conf;

limit_req_zone  $binary_remote_addr zone=login:10m  rate=5r/m;
limit_req_status 429;

upstream php_fpm {
    server unix:/run/php/php8.3-fpm.sock;
    keepalive 16;
}
