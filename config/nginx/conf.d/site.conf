# WordPress origin server. Cloudflare is the only client (enforced by the host
# firewall, see scripts/setup-vps.sh). server_name is a catch-all because
# Cloudflare only forwards hostnames that belong to the zone.

# HTTP -> HTTPS (Cloudflare "Always use HTTPS" normally handles this already)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /-/health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    root  /var/www/html;
    index index.php;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/wordpress-hardening.conf;

    # ---- Static assets: long-lived, served straight from disk ---------------
    # (no txt/xml/json here: robots.txt, sitemaps and feeds are dynamic WP routes)
    location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|mp4|webm|mp3|pdf)$ {
        try_files $uri =404;
        open_file_cache          max=20000 inactive=60s;
        open_file_cache_valid    120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors   on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-FastCGI-Cache "STATIC" always;
        access_log off;
        log_not_found off;
    }

    # ---- WordPress pretty permalinks ----------------------------------------
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ---- Login: brute-force protection, never cached, admin pool ------------
    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/fastcgi-php.conf;
        include /etc/nginx/snippets/security-headers.conf;
        fastcgi_pass php_admin;
    }

    # ---- REST API: rate-limited; anonymous GETs get a 10 s microcache -------
    # (TTL is set by wp/mu-plugins/cache-control.php via X-Accel-Expires)
    location ^~ /wp-json/ {
        limit_req zone=api burst=40 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    # ---- PHP: index.php, wp-admin/*.php, admin-ajax.php ... -----------------
    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/snippets/fastcgi-php.conf;
        include /etc/nginx/snippets/fastcgi-cache.conf;
        fastcgi_pass $php_upstream;
    }

    # ---- Health check for uptime monitors (no PHP, no cache) ---------------
    location = /-/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
