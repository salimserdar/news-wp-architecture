# Native http{} extras. Installed by scripts/setup-vps.sh as
# /etc/nginx/conf.d/00-news-wp.conf (Ubuntu's nginx.conf already includes conf.d/).
# Do not put server{} blocks here — those live in site.conf.

client_max_body_size     128m;
client_body_buffer_size  512k;
server_tokens            off;
keepalive_requests       1000;

# `gzip on;` is already set in Ubuntu's /etc/nginx/nginx.conf — repeating it here
# makes nginx -t fail with '"gzip" directive is duplicate'.
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/rss+xml application/atom+xml image/svg+xml
           application/xml application/xhtml+xml font/woff2 text/javascript;

include /etc/nginx/snippets/cloudflare-realip.conf;

limit_req_zone  $binary_remote_addr zone=login:10m  rate=5r/m;
limit_req_status 429;

upstream php_fpm {
    server unix:/run/php/php8.3-fpm.sock;
    keepalive 16;
}

# ---- Access log with FastCGI cache status (setup script disables the distro combined log)
log_format news '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'cache=$upstream_cache_status rt=$request_time urt=$upstream_response_time '
                'ray=$http_cf_ray bot=$bad_bot';
access_log /var/log/nginx/access.log news buffer=64k flush=5s;

# ---- FastCGI full-page cache (disk; hot files live in the OS page cache) ----
fastcgi_cache_path /var/cache/nginx/wp
    levels=1:2
    keys_zone=WORDPRESS:100m
    max_size=4g
    inactive=24h
    use_temp_path=off;

# Same key as wp/mu-plugins/cache-purge.php: md5("https" . host . uri)
fastcgi_cache_key "$scheme$host$cache_uri";

map $request_uri $cache_uri {
    default $request_uri;
    "~^(?<clean>[^?]*)\?(?:(?:utm_\w+|fbclid|gclid|gclsrc|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|twclid|ttclid|ref|source|s_kwcid)=[^&]*(?:&|$))+$" $clean;
}

map $request_method $skip_method {
    default 1;
    GET     0;
    HEAD    0;
}
map $http_cookie $skip_cookie {
    default                  0;
    "~*wordpress_logged_in_" 1;
    "~*wp-postpass_"         1;
    "~*comment_author_"      1;
    "~*wordpress_no_cache"   1;
    "~*woocommerce_"         1;
}
map $request_uri $skip_uri {
    default                          0;
    "~*^/wp-admin/"                  1;
    "~*^/wp-login\.php"              1;
    "~*^/xmlrpc\.php"                1;
    "~*^/wp-cron\.php"               1;
    "~*^/wp-comments-post\.php"      1;
    "~*(\?|&)(preview|p|page_id|customize_changeset_uuid|nocache)="  1;
}
map "$skip_method$skip_cookie$skip_uri" $skip_cache {
    default 1;
    "000"   0;
}

# Archive / AI / scanner UAs that walk unique URLs and pin PHP-FPM.
# Cloudflare "verified bots" (Ahrefs, Semrush, …) are allowed at the edge, so
# this has to live on the origin. Do not use a generic "bot" pattern:
# Googlebot, Bingbot, Googlebot-News, facebookexternalhit, Twitterbot,
# Slackbot, LinkedInBot, WhatsApp, TelegramBot, Applebot, UptimeRobot,
# Cloudflare-Healthchecks, news-cache-warmer and news-wp-k6 stay allowed.
# Google-Extended is a robots.txt token, not a User-Agent — cannot block it here.
# `if ($bad_bot = 1)` in wordpress-hardening.conf.
map $http_user_agent $bad_bot {
    default 0;
    ""      1;
    "-"     1;

    # SEO / backlink crawlers — full-archive walkers, almost no referrals
    ~*(AhrefsBot|AhrefsSiteAudit|SemrushBot|MJ12bot|DotBot|rogerbot|BLEXBot) 1;
    ~*(PetalBot|AspiegelBot|DataForSeo|Barkrowler|SEOkicks|sistrix|MauiBot)  1;
    ~*(ZoominfoBot|LinkpadBot|MegaIndex|BUbiNG|Seekport|Seobility|BacklinkCrawler) 1;
    ~*(Baiduspider|Sogou|YisouSpider|Bytespider) 1;

    # AI training / answer crawlers — they want every permalink, not the homepage
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|anthropic-ai|Claude-Web|CCBot) 1;
    ~*(Amazonbot|Applebot-Extended|PerplexityBot|Perplexity-User|Google-CloudVertexBot) 1;
    ~*(meta-externalagent|meta-externalfetcher|FacebookBot|cohere-ai|YouBot|Diffbot) 1;
    ~*(omgili|ImagesiftBot|Timpibot|Webzio-Extended|ICC-Crawler|aiHitBot|DuckAssistBot) 1;

    # Vulnerability scanners (UA is often honest; impersonators still look like Chrome)
    ~*(nikto|sqlmap|masscan|zgrab|nuclei|wpscan|dirbuster|gobuster) 1;
}

# Empty except for blocked bots — nginx skips add_header when the value is "".
map $bad_bot $bad_bot_cc {
    default "";
    1       "private, no-store";
}
