# Main nginx config — high-traffic WordPress origin behind Cloudflare.
# Site/server blocks live in conf.d/, reusable pieces in snippets/.

user  www-data;
worker_processes  2;              # 2 of 8 vCPU; cache hits are cheap
worker_rlimit_nofile 65535;
pid   /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging: cache status is the most important field we have ----------
    log_format news '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'cache=$upstream_cache_status rt=$request_time urt=$upstream_response_time '
                    'up=$upstream_addr ray=$http_cf_ray';
    access_log /var/log/nginx/access.log news buffer=64k flush=5s;

    # ---- Core tuning --------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 4096;
    server_tokens       off;
    client_max_body_size     128m;     # media uploads by editors
    client_body_buffer_size  512k;
    # NOTE: open_file_cache is intentionally NOT enabled globally. The FastCGI
    # cache reads its files through it, so a cached descriptor would keep
    # serving a page after the purge plugin deleted the file. It is enabled
    # only in the static-assets location (conf.d/site.conf).

    # ---- Compression (Cloudflare re-compresses with brotli toward readers) --
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml
               application/xml application/xhtml+xml font/woff2 text/javascript;

    # ---- Real client IP from Cloudflare -------------------------------------
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # ---- FastCGI full-page cache --------------------------------------------
    # Disk-backed (survives restarts, hot files live in the OS page cache).
    # Owned by www-data so the WordPress purge plugin can delete entries.
    fastcgi_cache_path /var/cache/nginx/wp
        levels=1:2
        keys_zone=WORDPRESS:100m
        max_size=4g
        inactive=24h
        use_temp_path=off;

    # Cache key WITHOUT method (HEAD shares GET entries) and with tracking
    # parameters stripped ($cache_uri) so ?utm_source=... hits the same entry.
    # The purge plugin recomputes exactly this key: md5("https" . host . uri).
    fastcgi_cache_key "$scheme$host$cache_uri";

    # Strip *pure* tracking query strings. If the query string contains ONLY
    # known tracking params, cache under the clean path; otherwise keep it.
    map $request_uri $cache_uri {
        default $request_uri;
        "~^(?<clean>[^?]*)\?(?:(?:utm_\w+|fbclid|gclid|gclsrc|dclid|msclkid|mc_cid|mc_eid|_ga|_gl|igshid|yclid|twclid|ttclid|ref|source|s_kwcid)=[^&]*(?:&|$))+$" $clean;
    }

    # ---- Cache bypass decision ----------------------------------------------
    map $request_method $skip_method {
        default 1;
        GET     0;
        HEAD    0;
    }
    map $http_cookie $skip_cookie {
        default                 0;
        "~*wordpress_logged_in_" 1;
        "~*wp-postpass_"         1;
        "~*comment_author_"      1;
        "~*wordpress_no_cache"   1;
        "~*woocommerce_"         1;
    }
    map $request_uri $skip_uri {
        default                          0;
        "~*^/wp-admin/"                  1;
        "~*^/wp-login\.php"              1;
        "~*^/xmlrpc\.php"                1;
        "~*^/wp-cron\.php"               1;
        "~*^/wp-comments-post\.php"      1;
        "~*(\?|&)(preview|p|page_id|customize_changeset_uuid|nocache)="  1;
    }
    map "$skip_method$skip_cookie$skip_uri" $skip_cache {
        default 1;
        "000"   0;
    }

    # Logged-in users and wp-admin go to the dedicated admin FPM pool so heavy
    # editorial work can never starve the pool that renders public cache misses.
    map $request_uri $admin_uri {
        default             0;
        "~*^/wp-admin/"     1;
        "~*^/wp-login\.php" 1;
    }
    map "$skip_cookie$admin_uri" $php_upstream {
        default   php_admin;
        "00"      php_www;
    }

    upstream php_www   { server php:9000;       keepalive 32; }
    upstream php_admin { server php-admin:9000; keepalive 8;  }

    # ---- Rate limiting (per real reader IP, see realip snippet) -------------
    limit_req_zone  $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=api:10m    rate=20r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
