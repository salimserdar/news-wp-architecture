# Common FastCGI parameters for PHP-FPM upstreams.
# Read/send timeouts are NOT set here: site.conf sets the public default at
# server level and overrides it for /wp-admin/ (a second value in the same
# location would be a duplicate-directive error).
fastcgi_split_path_info ^(.+\.php)(/.+)$;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param PATH_INFO       $fastcgi_path_info;
fastcgi_param HTTPS           on;
fastcgi_param HTTP_X_FORWARDED_PROTO https;
fastcgi_index index.php;
fastcgi_intercept_errors off;
# fastcgi_keep_conn stays off (default): see the upstream comment in http.conf.
# Unix socket connect() is immediate; when the listen queue is full it fails
# at once and the cache serves STALE instead of parking the request.
fastcgi_connect_timeout 5s;
fastcgi_buffers         32 32k;
fastcgi_buffer_size     64k;
fastcgi_busy_buffers_size 128k;
