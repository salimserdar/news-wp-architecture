# FastCGI full-page cache behaviour. Included in PHP locations.
# Zone, key and $skip_cache are defined in nginx.conf.

fastcgi_cache        WORDPRESS;
fastcgi_cache_bypass $skip_cache;
fastcgi_no_cache     $skip_cache;
fastcgi_cache_methods GET HEAD;

# Default TTLs. PHP can override per-response with X-Accel-Expires
# (wp/mu-plugins/cache-control.php: search 10 s, feeds 5 min, REST 10 s, 404 1 min).
fastcgi_cache_valid 200 301 302 10m;
fastcgi_cache_valid 404          1m;
fastcgi_cache_valid any          0;
fastcgi_cache_min_uses 1;

# --- Spike resilience -------------------------------------------------------
# One render per URL at a time; concurrent requests wait for it (or get stale).
fastcgi_cache_lock         on;
fastcgi_cache_lock_timeout 5s;
fastcgi_cache_lock_age     5s;
# Serve the old copy while refreshing in the background, and keep serving it
# if PHP-FPM or the database is down.
# (fastcgi_cache_use_stale has no http_502/504 — "error"/"timeout" cover a dead FPM)
fastcgi_cache_use_stale error timeout invalid_header updating
                        http_500 http_503 http_429;
fastcgi_cache_background_update on;

# Our $skip_cache map decides cacheability, not WordPress' Cache-Control /
# Expires headers (they still pass through to Cloudflare untouched).
# Set-Cookie is deliberately NOT ignored: a response that sets a cookie is
# never cached (nginx default), so cookies can't leak between readers.
fastcgi_ignore_headers Cache-Control Expires;
fastcgi_hide_header    X-Powered-By;

# add_header is not inherited once a location defines its own, so re-include.
include /etc/nginx/snippets/security-headers.conf;
add_header X-FastCGI-Cache $upstream_cache_status always;
