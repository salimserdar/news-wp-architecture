# WordPress-specific hardening. Included in the main server block.

# Drop archive/AI/scanner bots before try_files / PHP. Safe use of `if`
# (return only — add_header is not allowed inside if). $bad_bot_cc is empty
# for everyone else, so nginx omits the header and does not override PHP.
# Allow-list / extra blocks: map $http_user_agent $bad_bot in http.conf.
add_header Cache-Control $bad_bot_cc always;
if ($bad_bot = 1) {
    return 403;
}

# No PHP execution where users can upload files.
location ~* ^/wp-content/uploads/.*\.(?:php|phtml|phar|pl|py|cgi|sh)$ { deny all; }

# Sensitive files.
location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
location ~* ^/(?:wp-config\.php|readme\.html|license\.txt|wp-content/debug\.log|xmlrpc\.php)$ {
    deny all; access_log off; log_not_found off;
}
# xmlrpc.php is blocked above. If you need Jetpack / the mobile app, replace
# that entry with a rate-limited PHP location instead.

# Don't let anonymous traffic enumerate authors (?author=1 -> /author/name/)
if ($args ~* "^author=\d+") { return 403; }

# wp-includes PHP files are never meant to be called directly.
location ~* ^/wp-includes/.*\.php$ { deny all; }
location ~* ^/wp-includes/js/tinymce/langs/.*\.php$ { deny all; }
location ~* ^/wp-content/(?:plugins|themes)/.*\.(?:log|sql|bak|old|orig|txt)$ { deny all; }

# Small, favicon-type noise.
location = /favicon.ico { log_not_found off; access_log off; try_files $uri =204; }
