# TLS between Cloudflare and the origin.
# Certificate: Cloudflare Origin CA (see certs/README.md). Readers never see
# this cert — Cloudflare presents its own edge certificate to browsers.
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache   shared:SSL:20m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Optional: Authenticated Origin Pulls — only Cloudflare can complete the TLS
# handshake. Download the CA from
# https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/set-up/
# to certs/cloudflare-origin-pull-ca.pem, enable the feature in the dashboard,
# then uncomment:
# ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
# ssl_verify_client on;
