# Redis as a WordPress object cache. It is a cache, not a datastore:
# no persistence, LRU eviction, only reachable inside the compose network
# (no published port, so protected-mode can be off).
bind 0.0.0.0
port 6379
protected-mode no

# Memory: evict least-recently-used keys when full
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# No persistence
save ""
appendonly no

# Networking
tcp-backlog 4096
tcp-keepalive 300
timeout 0
io-threads 2

# Housekeeping
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
activedefrag yes

loglevel notice
databases 4
