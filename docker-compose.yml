# Local theme and plugin development only. Not used on the VPS.
# Theme, plugin, and mu-plugins are bind-mounted from this repo.
# WordPress core and the local database stay in Docker volumes.
# Do not point this file at the production .env (Cloudflare, R2, GCS).

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      # Aggregator runs on the host. 127.0.0.1 inside this container is not that process.
      # Values come from the repo .env. Only these names are passed in.
      SITE_AGGREGATOR_SERVICE_URL: ${SITE_AGGREGATOR_SERVICE_URL:-http://host.docker.internal:3000}
      SITE_AGGREGATOR_READ_API_KEY: ${SITE_AGGREGATOR_READ_API_KEY:-}
      SITE_AGGREGATOR_SYNC_TOKEN: ${SITE_AGGREGATOR_SYNC_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      # Skip R2 during local uploads. Production never sets this.
      NEWS_R2_OFFLOAD: "0"
      NEWS_MEDIA_URL: http://localhost:8080
      WORDPRESS_CONFIG_EXTRA: |
        define( 'SITE_AGGREGATOR_SERVICE_URL', getenv( 'SITE_AGGREGATOR_SERVICE_URL' ) ?: 'http://host.docker.internal:3000' );
        define( 'SITE_AGGREGATOR_READ_API_KEY', getenv( 'SITE_AGGREGATOR_READ_API_KEY' ) ?: '' );
        define( 'SITE_AGGREGATOR_SYNC_TOKEN', getenv( 'SITE_AGGREGATOR_SYNC_TOKEN' ) ?: '' );
        define( 'YOUTUBE_API_KEY', getenv( 'YOUTUBE_API_KEY' ) ?: '' );
        define( 'YOUTUBE_CHANNEL_ID', getenv( 'YOUTUBE_CHANNEL_ID' ) ?: '' );
        if ( ! defined( 'NEWS_R2_OFFLOAD' ) ) { define( 'NEWS_R2_OFFLOAD', false ); }
        if ( ! defined( 'NEWS_MEDIA_URL' ) ) { define( 'NEWS_MEDIA_URL', 'http://localhost:8080' ); }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/local-entrypoint.sh"]
    command: ["apache2-foreground"]
    volumes:
      - wp_core:/var/www/html
      - ./docker/wordpress-entrypoint.sh:/local-entrypoint.sh:ro
      - ./wp/themes:/var/www/html/wp-content/themes
      - ./wp/plugins:/var/www/html/wp-content/plugins
      - ./wp/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  wp_core:
